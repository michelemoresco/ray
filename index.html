<script>
window.addEventListener('error',e=>{const s=document.getElementById('sync');if(s)s.textContent='Errore: '+e.message});
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromYmd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c,12)};
const addDays=(s,n)=>{const d=fromYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const diff=s=>Math.round((fromYmd(s)-fromYmd(today()))/864e5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const WD=['domenica','lunedi','martedi','mercoledi','giovedi','venerdi','sabato'];
const WDS=['dom','lun','mar','mer','gio','ven','sab'];
const CATS={lavoro:'🎓 University',famiglia:'👨‍👩‍👧 Family',scadenze:'🧾 Deadlines',altro:'📌 Others'};
const ALIAS={lavoro:'lavoro',work:'lavoro',university:'lavoro',famiglia:'famiglia',family:'famiglia',scadenze:'scadenze',deadlines:'scadenze',deadline:'scadenze',altro:'altro',others:'altro',other:'altro'};
const REM={scadenze:[7,1,0],lavoro:[1],famiglia:[1],altro:[1]};
const RX_SC=/\b(tari|tasi|imu|tasse?|irpef|iva|bollo|f24|730|unico|isee|rca|assicurazione|canone|mav|pagopa|rinnovo|scadenza|inps|inail|multa|revisione|commercialista|acconto|saldo)\b/i;
const RX_FA=/\b(figli[ae]|figlie|spesa|pediatra|scuola|dentista|cena|compleanno|nonn[oi]|saggio|festa|palestra|sport|catechismo|colloqui|genitori)\b/i;
const PRE='(?:\\b(?:entro(?:\\s+il)?|per(?:\\s+il)?|il)\\s+)?';

function nextYearless(d,m){let y=new Date().getFullYear();let s=y+'-'+pad(m)+'-'+pad(d);if(s<today())s=(y+1)+'-'+pad(m)+'-'+pad(d);return s}
function parse(raw){
  let t=' '+raw+' ',due=null,time=null,cat=null,rec=null;
  t=t.replace(/#(lavoro|famiglia|scadenze|altro|work|university|family|deadlines|deadline|others|other)(?=[\s,.;]|$)/i,(m,c)=>{cat=ALIAS[c.toLowerCase()];return ' '});
  t=t.replace(/\bogni\s+(?:(\d+)\s+)?(giorno|giorni|settimana|settimane|mese|mesi|anno|anni)(?=[\s,.;]|$)/i,(m,n,u)=>{rec={u:{g:'d',s:'w',m:'m',a:'y'}[u[0].toLowerCase()],n:+n||1};return ' '});
  if(!rec)t=t.replace(/\bogni\s+(domenica|lunedi|lunedì|martedi|martedì|mercoledi|mercoledì|giovedi|giovedì|venerdi|venerdì|sabato)(?=[\s,.;]|$)/i,(m,w)=>{rec={u:'w',n:1};return ' '+w+' '});
  t=t.replace(/\b(?:alle|ore)\s*(\d{1,2})(?:[:.](\d{2}))?(?=[\s,.;]|$)|\b(\d{1,2}):(\d{2})\b/i,(m,a,b,c,d)=>{const h=+(a??c),mi=+(b??d??0);if(h<24&&mi<60){time=pad(h)+':'+pad(mi);return ' '}return m});
  const now=today();
  const rules=[
    [/\b(dopodomani)(?=[\s,.;]|$)/,()=>addDays(now,2)],
    [/\b(oggi)(?=[\s,.;]|$)/,()=>now],
    [/\b(domani)(?=[\s,.;]|$)/,()=>addDays(now,1)],
    [/\btra\s+(\d+)\s+(giorni|giorno|settimane|settimana)(?=[\s,.;]|$)/,(m,n,u)=>addDays(now,+n*(/sett/.test(u)?7:1))],
    [/\b(\d{1,2})\s+(gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre)(?:\s+(\d{4}))?(?=[\s,.;]|$)/,(m,d,mo,y)=>{const M=MON.indexOf(mo)+1;return y?y+'-'+pad(M)+'-'+pad(+d):nextYearless(+d,M)}],
    [/\b(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?(?=[\s,.;]|$)/,(m,d,mo,y)=>{if(+mo<1||+mo>12||+d<1||+d>31)return null;if(y){y=+y<100?2000+ +y:+y;return y+'-'+pad(+mo)+'-'+pad(+d)}return nextYearless(+d,+mo)}],
    [/(?:\b(prossimo)\s+)?\b(domenica|lunedi|lunedì|martedi|martedì|mercoledi|mercoledì|giovedi|giovedì|venerdi|venerdì|sabato)(?:\s+prossimo)?(?=[\s,.;]|$)/,(m,p,w)=>{const i=WD.indexOf(w.normalize('NFD').replace(/[\u0300-\u036f]/g,''));const dow=new Date().getDay();return addDays(now,((i-dow+7)%7)||7)}]
  ];
  for(const [rx,fn] of rules){
    const re=new RegExp(PRE+rx.source,'i');
    const mt=t.match(re);
    if(mt){const r=fn(...mt.slice(0));if(r){due=r;t=t.replace(re,' ');break}}
  }
  if(rec&&!due)due=now;
  let title=t.replace(/\s+/g,' ').trim().replace(/[,\-–:;]+$/,'').trim();
  if(!title)title=raw.trim();
  title=title.charAt(0).toUpperCase()+title.slice(1);
  if(!cat)cat=RX_SC.test(raw)?'scadenze':RX_FA.test(raw)?'famiglia':'altro';
  return{title,due,time,cat,rec,rem:due?REM[cat]:[]};
}
const fmtDate=s=>{const d=fromYmd(s);return WDS[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()].slice(0,3)+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')};
const rel=s=>{const n=diff(s);return n===0?'oggi':n===1?'domani':n===-1?'ieri':n<0?(-n)+' gg fa':'tra '+n+' gg'};

let justDone=null;const CK=Object.keys(CATS);let hidden=new Set();try{hidden=new Set(JSON.parse(localStorage.getItem('au_hidden')||'[]'))}catch(e){}
let tasks=[],tab='list',ref=null,uid=null;
const LS='agenda_unica_v1';
try{tasks=JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){tasks=[]}
let stamp=0;try{stamp=+(localStorage.getItem('au_upd')||0)}catch(e){}
function save(){
  stamp=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(tasks));localStorage.setItem('au_upd',stamp)}catch(e){}
  render();
  const bad=()=>{$('#sync').textContent='⚠ Sync non riuscita (dati solo su questo dispositivo)'};
  if(ref){try{ref.set({tasks,updated:stamp}).catch(bad)}catch(e){bad()}}
}
function tdate(t){return t.due?t.due+(t.time?' '+t.time:''):'9999'}
function active(t){if(t.done)return false;if(!t.due)return false;const mx=Math.max(0,...(t.rem||[0]));return diff(t.due)<=mx}

function item(t){
  const n=t.due?diff(t.due):null;
  const cls=n!==null&&n<0&&!t.done?'late':n!==null&&n<=2&&!t.done?'soon':'';
  return `<div class="t c-${t.cat||'altro'} ${t.done?'done':''} ${t.id===justDone?'pop':''}"><input type="checkbox" data-act="done" data-id="${t.id}" ${t.done?'checked':''} aria-label="Fatto"><div class="b" data-act="edit" data-id="${t.id}"><div class="ti">${esc(t.title)}</div><div class="m"><span class="tag">${CATS[t.cat]||CATS.altro}</span>${t.due?`<span class="${cls}">${fmtDate(t.due)}${t.time?' · '+t.time:''} · ${rel(t.due)}</span>`:'senza scadenza'}${t.rem&&t.rem.length&&t.due?' · 🔔 '+t.rem.map(r=>r?r+'g':'0').join('/'):''}${t.rec?' · 🔁 '+recLabel(t.rec):''}</div></div>${t.due&&!t.done?`<button class="ic" data-act="gcal" data-id="${t.id}" title="Aggiungi a Google Calendar">📅</button>`:''}<button class="ic" data-act="del" data-id="${t.id}" title="Elimina">✕</button></div>`;
}
function hello(){const n=new Date(),dn=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'][n.getDay()],o=tasks.filter(t=>!t.done&&t.due),td=o.filter(t=>t.due===today()).length,ov=o.filter(t=>t.due<today()).length;
  $('#hello').textContent=dn+' '+n.getDate()+' '+MON[n.getMonth()]+' · '+(td?td+(td===1?' cosa per oggi':' cose per oggi'):'niente in scadenza oggi')+(ov?' · '+ov+' in ritardo':'')}
function ideaItem(i){const p=projOf(i)||{name:'',color:'#d9c34a'},sb=i.sid?subOf(i):null,bo=BS.boards.length>1?boardOfIdea(i):null;
  return `<div class="t ${i.done?'done':''}" style="--cl:${p.color}"><input type="checkbox" data-act="idone" data-id="${i.id}" ${i.done?'checked':''} aria-label="Done"><div class="b" data-act="iedit" data-id="${i.id}"><div class="ti">${esc(i.text)}</div><div class="m"><span class="tag">💡 ${bo?esc(bo.name)+' › ':''}${esc(p.name)}${sb?' › '+esc(sb.name):''}</span>${fmtDate(i.due)}${i.time?' · '+i.time:''} · ${rel(i.due)}</div></div></div>`}
let linkMode=false,linkSrc=null;
const hh=id=>{let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
const rot=(id,k)=>(((hh(id)%200)/100)-1)*k;
function unlink(keys){BD.links=BD.links.filter(l=>!keys.includes(l.a)&&!keys.includes(l.b))}
function autoPlace(){const NC=Math.max(4,Math.min(8,Math.floor((innerWidth-60)/250))),H=Array(NC).fill(0),n=p=>BD.ideas.filter(i=>i.pid===p.id).length+BD.subs.filter(s=>s.pid===p.id).length*1.5;
  BD.projects.forEach(p=>{if(typeof p.x==='number'){const c=Math.max(0,Math.min(NC-1,Math.round((p.x-30)/250)));H[c]=Math.max(H[c],p.y+110+n(p)*34)}});
  BD.projects.forEach(p=>{if(typeof p.x!=='number'){let c=0;for(let k=1;k<NC;k++)if(H[k]<H[c])c=k;p.x=30+c*250+Math.round(Math.random()*14);p.y=H[c]+24+Math.round(Math.random()*12);H[c]=p.y+110+n(p)*34}})}
function ul(color,id){const a=hh(id)%5-2;return `<svg class="ul" viewBox="0 0 200 10" preserveAspectRatio="none"><path d="M2 ${6+a} C 40 ${2+a}, 70 ${9-a}, 110 ${5+a} S 170 ${3-a}, 198 ${6+a}" stroke="${color}"/></svg>`}

function gcalUrl(t){
  const d=t.due.replace(/-/g,'');let dates;
  if(t.time){const s=d+'T'+t.time.replace(':','')+'00';const e=new Date(fromYmd(t.due));const [h,m]=t.time.split(':');e.setHours(+h+1,+m);dates=s+'/'+ymd(e).replace(/-/g,'')+'T'+pad(e.getHours())+pad(e.getMinutes())+'00'}
  else dates=d+'/'+addDays(t.due,1).replace(/-/g,'');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(t.title)+'&dates='+dates+'&details='+encodeURIComponent(CATS[t.cat]+' — da Agenda unica')+(t.rec?'&recur='+encodeURIComponent(rrule(t.rec)):'');

function icsText(){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Agenda unica//IT','CALSCALE:GREGORIAN'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  tasks.filter(t=>t.due&&!t.done).forEach(t=>{
    L.push('BEGIN:VEVENT','UID:'+t.id+'@agenda-unica','DTSTAMP:'+stamp,'SUMMARY:'+t.title.replace(/[,;\\]/g,'\\$&'));
    const d=t.due.replace(/-/g,'');
    if(t.time){const e=new Date(fromYmd(t.due));const[h,m]=t.time.split(':');e.setHours(+h+1,+m);L.push('DTSTART:'+d+'T'+t.time.replace(':','')+'00','DTEND:'+ymd(e).replace(/-/g,'')+'T'+pad(e.getHours())+pad(e.getMinutes())+'00')}
    else L.push('DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+addDays(t.due,1).replace(/-/g,''));
    if(t.rec)L.push(rrule(t.rec));
    (t.rem||[]).forEach(r=>{
      const a=fromYmd(addDays(t.due,-r));a.setHours(9,0,0,0);
      L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+t.title.replace(/[,;\\]/g,'\\$&'),'TRIGGER;VALUE=DATE-TIME:'+a.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''),'END:VALARM');
    });
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');return L.join('\r\n');
}
