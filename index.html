const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

const addDays=(s,n)=>{const d=fromYmd(s);d.setDate(d.getDate()+n);return ymd(d)};

const WDS=['dom','lun','mar','mer','gio','ven','sab'];

const REM={scadenze:[7,1,0],lavoro:[1],famiglia:[1],altro:[1]};
const RX_SC=/\b(tari|tasi|imu|tasse?|irpef|iva|bollo|f24|730|unico|isee|rca|assicurazione|canone|mav|pagopa|rinnovo|scadenza|inps|inail|multa|revisione|commercialista|acconto|saldo)\b/i;
const RX_FA=/\b(figli[ae]|figlie|spesa|pediatra|scuola|dentista|cena|compleanno|nonn[oi]|saggio|festa|palestra|sport|catechismo|colloqui|genitori|cate|caterina|lucia|luci|agne|agnese|giulia|giuli)\b/i;
const RX_UN=/\b(telecon|meeting|et|wst|euclid|lisa|lezioni|swg|div2|riunione|gwac|tada|elementi\s+di\s+informatica|astronomia|virgo|lvk|call|cb|cds|consiglio)\b/i;
const PRE='(?:\\b(?:entro(?:\\s+il)?|per(?:\\s+il)?|il)\\s+)?';

function nextYearless(d,m){let y=new Date().getFullYear();let s=y+'-'+pad(m)+'-'+pad(d);if(s<today())s=(y+1)+'-'+pad(m)+'-'+pad(d);return s}
function parse(raw){
  let t=' '+raw+' ',due=null,time=null,cat=null,rec=null;
  t=t.replace(/#(lavoro|famiglia|scadenze|altro|work|university|family|deadlines|deadline|others|other)(?=[\s,.;]|$)/i,(m,c)=>{cat=ALIAS[c.toLowerCase()];return ' '});
  t=t.replace(/\bogni\s+(?:(\d+)\s+)?(giorno|giorni|settimana|settimane|mese|mesi|anno|anni)(?=[\s,.;]|$)/i,(m,n,u)=>{rec={u:{g:'d',s:'w',m:'m',a:'y'}[u[0].toLowerCase()],n:+n||1};return ' '});
  if(!rec)t=t.replace(/\bogni\s+(domenica|lunedi|lunedì|martedi|martedì|mercoledi|mercoledì|giovedi|giovedì|venerdi|venerdì|sabato)(?=[\s,.;]|$)/i,(m,w)=>{rec={u:'w',n:1};return ' '+w+' '});
  t=t.replace(/\b(?:alle|ore|h)\s*(\d{1,2})(?:[:.](\d{2}))?(?=[\s,.;]|$)|\b(\d{1,2}):(\d{2})\b/i,(m,a,b,c,d)=>{const h=+(a??c),mi=+(b??d??0);if(h<24&&mi<60){time=pad(h)+':'+pad(mi);return ' '}return m});
  const now=today();
  const rules=[
    [/\b(dopodomani)(?=[\s,.;]|$)/,()=>addDays(now,2)],
    [/\b(oggi)(?=[\s,.;]|$)/,()=>now],
    [/\b(domani)(?=[\s,.;]|$)/,()=>addDays(now,1)],
    [/\btra\s+(\d+)\s+(giorni|giorno|settimane|settimana)(?=[\s,.;]|$)/,(m,n,u)=>addDays(now,+n*(/sett/.test(u)?7:1))],
    [/\b(\d{1,2})\s+(gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre)(?:\s+(\d{4}))?(?=[\s,.;]|$)/,(m,d,mo,y)=>{const M=MON.indexOf(mo)+1;return y?y+'-'+pad(M)+'-'+pad(+d):nextYearless(+d,M)}],
    [/\b(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?(?=[\s,.;]|$)/,(m,d,mo,y)=>{if(+mo<1||+mo>12||+d<1||+d>31)return null;if(y){y=+y<100?2000+ +y:+y;return y+'-'+pad(+mo)+'-'+pad(+d)}return nextYearless(+d,+mo)}],
    [/(?:\b(prossimo)\s+)?\b(domenica|lunedi|lunedì|martedi|martedì|mercoledi|mercoledì|giovedi|giovedì|venerdi|venerdì|sabato)(?:\s+prossimo)?(?=[\s,.;]|$)/,(m,p,w)=>{const i=WD.indexOf(w.normalize('NFD').replace(/[\u0300-\u036f]/g,''));const dow=new Date().getDay();return addDays(now,((i-dow+7)%7)||7)}]
  ];
  for(const [rx,fn] of rules){
    const re=new RegExp(PRE+rx.source,'i');
    const mt=t.match(re);
    if(mt){const r=fn(...mt.slice(0));if(r){due=r;t=t.replace(re,' ');break}}
  }
  if(rec&&!due)due=now;
  let title=t.replace(/\s+/g,' ').trim().replace(/[,\-–:;]+$/,'').trim();
  if(!title)title=raw.trim();
  title=title.charAt(0).toUpperCase()+title.slice(1);
  if(!cat)cat=RX_SC.test(raw)?'scadenze':RX_FA.test(raw)?'famiglia':RX_UN.test(raw)?'lavoro':'altro';
  return{title,due,time,cat,rec,rem:due?REM[cat]:[]};
}
const fmtDate=s=>{const d=fromYmd(s);return WDS[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()].slice(0,3)+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')};
const rel=s=>{const n=diff(s);return n===0?'oggi':n===1?'domani':n===-1?'ieri':n<0?(-n)+' gg fa':'tra '+n+' gg'};

let justDone=null;const CK=Object.keys(CATS);let hidden=new Set();try{hidden=new Set(JSON.parse(localStorage.getItem('au_hidden')||'[]'))}catch(e){}

function active(t){if(t.done)return false;if(!t.due)return false;const mx=Math.max(0,...(t.rem||[0]));return diff(t.due)<=mx}

let linkMode=false,linkSrc=null,zm=1,bdLock=false;
const hh=id=>{let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
const rot=(id,k)=>(((hh(id)%200)/100)-1)*k;
function unlink(keys){BD.links=BD.links.filter(l=>!keys.includes(l.a)&&!keys.includes(l.b))}
function autoPlace(){const NC=Math.max(4,Math.min(8,Math.floor((innerWidth-60)/250))),H=Array(NC).fill(0),n=p=>BD.ideas.filter(i=>i.pid===p.id).length+BD.subs.filter(s=>s.pid===p.id).length*1.5;
  BD.projects.forEach(p=>{if(typeof p.x==='number'){const c=Math.max(0,Math.min(NC-1,Math.round((p.x-30)/250)));H[c]=Math.max(H[c],p.y+110+n(p)*34)}});
  BD.projects.forEach(p=>{if(typeof p.x!=='number'){let c=0;for(let k=1;k<NC;k++)if(H[k]<H[c])c=k;p.x=30+c*250+Math.round(Math.random()*14);p.y=H[c]+24+Math.round(Math.random()*12);H[c]=p.y+110+n(p)*34}})}
function ul(color,id){const a=hh(id)%5-2;return `<svg class="ul" viewBox="0 0 200 10" preserveAspectRatio="none"><path d="M2 ${6+a} C 40 ${2+a}, 70 ${9-a}, 110 ${5+a} S 170 ${3-a}, 198 ${6+a}" stroke="${color}"/></svg>`}
function ideaLi(i){return `<li class="wi${i.done?' dn2':''}" style="margin-left:${hh(i.id)%6}px;transform:rotate(${rot(i.id,.9).toFixed(2)}deg)"><span class="ck" data-act="idone" data-id="${i.id}">${i.done?'✓':'○'}</span><span class="tx${linkSrc==='i:'+i.id?' sel':''}" data-node="i:${i.id}" data-act="iedit" data-id="${i.id}">${esc(i.text)}${i.due?` <small>· ${fmtDate(i.due)}</small>`:''}</span></li>`}
function boardView(){
  if(!BD.projects.length)return '<div class="bw"><div class="bs"><div class="bde">La lavagna è vuota.<br>Tocca + e scegli “Idea” per iniziare il primo progetto.</div></div><div class="tray"></div></div>';
  autoPlace();
  const tools=`<div class="wk"><button data-act="linkmode" class="${linkMode?'on':''}">🔗 Collega</button><button data-act="bdlock" class="${bdLock?'on':''}" title="Blocca modifiche e consenti solo pan">${bdLock?'🔒 Bloccata':'🔓 Lock'}</button><button data-act="fs" class="fsb" title="Schermo intero">⛶</button><span class="note">${bdLock?'Modalità sola navigazione (pan libero, modifiche bloccate)':(linkMode?(linkSrc?'Ora tocca l’elemento di arrivo':'Tocca l’elemento di partenza'):'Trascina titoli, sottoprogetti e pallini ○ per spostarli · tocca una freccia per eliminarla')}</span></div>`;
  const ps=BD.projects.map(p=>{
    const subs=BD.subs.filter(s=>s.pid===p.id),ids=new Set(subs.map(s=>s.id)),mine=BD.ideas.filter(i=>i.pid===p.id),
      root=mine.filter(i=>!(i.sid&&ids.has(i.sid))),
      sw=pcol===p.id?`<div class="sw">${CHALK.map(c=>`<i style="--c:${c}" data-pc="${c}" data-pid="${p.id}" class="${c===p.color?'on':''}"></i>`).join('')}</div>`:'';
    const sbs=subs.map(sb=>`<div class="sb dz" data-pid="${p.id}" data-sid="${sb.id}"><div class="sn"><span data-node="s:${sb.id}" class="${linkSrc==='s:'+sb.id?'sel':''}">${esc(sb.name)}</span></div>${ul(p.color,sb.id).replace('class="ul"','class="ul sm"')}<ul class="wl">${mine.filter(i=>i.sid===sb.id).map(ideaLi).join('')}</ul><div class="sa"><button data-act="siadd" data-id="${sb.id}">+ add</button><button data-act="sren" data-id="${sb.id}" title="Rinomina">✎</button><button data-act="sdel" data-id="${sb.id}" title="Elimina">✕</button></div></div>`).join('');
    return `<div class="wp" data-pid="${p.id}" style="--ch:${p.color};left:${p.x}px;top:${p.y}px;transform:rotate(${rot(p.id,1.4).toFixed(2)}deg)"><div class="wt"><span class="dh${linkSrc==='p:'+p.id?' sel':''}" data-node="p:${p.id}">${esc(p.name)}</span></div>${ul(p.color,p.id)}${sw}<div class="rb dz" data-pid="${p.id}" data-sid=""><ul class="wl">${root.map(ideaLi).join('')}</ul></div>${sbs}<div class="wa"><button data-act="padd" data-id="${p.id}">+ add</button><button data-act="sadd" data-id="${p.id}">+ sub</button><button data-act="pcol" data-id="${p.id}" title="Colore">🎨</button><button data-act="pren" data-id="${p.id}" title="Rinomina">✎</button><button data-act="pdel" data-id="${p.id}" title="Elimina">✕</button></div></div>`}).join('');
  const zbar=`<div class="zbar"><button type="button" data-act="zout" title="Riduci zoom">−</button><span>${Math.round(zm*100)}%</span><button type="button" data-act="zin" title="Aumenta zoom">+</button><button type="button" data-act="bdlock" class="${bdLock?'on':''}" title="Solo pan (blocca modifiche)">${bdLock?'🔒':'🔓'}</button></div>`;
  return tools+`<div class="bw"><div class="bs"><div class="cv" style="transform:scale(${zm});transform-origin:0 0"><svg class="ar" id="ar"></svg>${ps}</div>${zbar}</div><div class="tray"><i style="left:18px;width:26px;transform:rotate(-4deg)"></i><i style="left:52px;width:18px;background:#f4d35e;transform:rotate(3deg)"></i><b></b></div></div>`;

function trect(el){try{const r=document.createRange();r.selectNodeContents(el);const b=r.getBoundingClientRect();if(b&&b.width)return b}catch(e){}return el.getBoundingClientRect()}
function nodeRect(el,cr){const a=trect(el);let l=a.left,t=a.top,r=a.right,b=a.bottom;
  if(el.classList.contains('tx')&&el.previousElementSibling){const c=el.previousElementSibling.getBoundingClientRect();l=Math.min(l,c.left);t=Math.min(t,c.top);r=Math.max(r,c.right);b=Math.max(b,c.bottom)}
  return{x:l-cr.left,y:t-cr.top,w:r-l,h:b-t}}
function bez(p0,c1,c2,p1,t){const u=1-t;return{x:u*u*u*p0.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*p1.x,y:u*u*u*p0.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*p1.y}}
function sidePt(r,s,g){return s==='l'?{x:r.x-g,y:r.y+r.h/2,ox:-1,oy:0}:s==='r'?{x:r.x+r.w+g,y:r.y+r.h/2,ox:1,oy:0}:s==='t'?{x:r.x+r.w/2,y:r.y-g,ox:0,oy:-1}:{x:r.x+r.w/2,y:r.y+r.h+g,ox:0,oy:1}}
function route(ra,rb,ia,ib,others){
  const ca={x:ra.x+ra.w/2,y:ra.y+ra.h/2},cb={x:rb.x+rb.w/2,y:rb.y+rb.h/2},dx=cb.x-ca.x,dy=cb.y-ca.y,dist=Math.hypot(dx,dy)||1,ux=dx/dist,uy=dy/dist,nx=-uy,ny=ux;
  const order=(r,idea,tx,ty)=>(idea?['l','r']:['l','r','t','b']).map(s=>sidePt(r,s,7)).sort((a,b)=>(b.ox*tx+b.oy*ty)-(a.ox*tx+a.oy*ty));
  const A=order(ra,ia,ux,uy),B=order(rb,ib,-ux,-uy),ob=others.map(o=>[o.x-8,o.y-8,o.x+o.w+8,o.y+o.h+8]);
  let best=null,bs=1e9;
  for(let ai=0;ai<A.length;ai++)for(let bi=0;bi<B.length;bi++){
    const a=A[ai],b=B[bi];
    for(const m of [.5,.9,1.5,2.4])for(const sv of [0,.35,-.35,.7,-.7]){
      const k=Math.max(40,Math.min(220,dist*.4))*m,off=sv*dist*.5;
      const c1={x:a.x+a.ox*k+nx*off,y:a.y+a.oy*k+ny*off},c2={x:b.x+b.ox*k+nx*off,y:b.y+b.oy*k+ny*off};
      let col=0;
      for(let t=.04;t<.97;t+=.03){const q=bez(a,c1,c2,b,t);if(q.x<4||q.y<4){col+=2;continue}
        for(const o of ob)if(q.x>o[0]&&q.x<o[2]&&q.y>o[1]&&q.y<o[3]){col++;break}}
      const pen=(ai+bi)*.15+m*.08+Math.abs(sv)*.25,sc=col*10+pen;
      if(sc<bs){bs=sc;best={p0:a,p1:b,c1,c2}}
      if(col===0&&pen<.45)return best}}

function icsText(){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Agenda unica//IT','CALSCALE:GREGORIAN'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  tasks.filter(t=>t.due&&!t.done).forEach(t=>{
    L.push('BEGIN:VEVENT','UID:'+t.id+'@agenda-unica','DTSTAMP:'+stamp,'SUMMARY:'+t.title.replace(/[,;\\]/g,'\\$&'));
    const d=t.due.replace(/-/g,'');
    if(t.time){const e=new Date(fromYmd(t.due));const[h,m]=t.time.split(':');e.setHours(+h+1,+m);L.push('DTSTART:'+d+'T'+t.time.replace(':','')+'00','DTEND:'+ymd(e).replace(/-/g,'')+'T'+pad(e.getHours())+pad(e.getMinutes())+'00')}
    else L.push('DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+addDays(t.due,1).replace(/-/g,''));
    if(t.rec)L.push(rrule(t.rec));
    (t.rem||[]).forEach(r=>{
      const a=fromYmd(addDays(t.due,-r));a.setHours(9,0,0,0);
      L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+t.title.replace(/[,;\\]/g,'\\$&'),'TRIGGER;VALUE=DATE-TIME:'+a.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''),'END:VALARM');

  });
  L.push('END:VCALENDAR');return L.join('\r\n');
}

    if(fsub==='new'){sname=$('#ns').value.trim();if(!sname){$('#ns').placeholder='Scrivi il nome del sottoprogetto';$('#ns').focus();return}}
    if(newG){pid=nid();BD.projects.push({id:pid,name:gname,color:ncol})}
    let sid=fsub;if(fsub==='new'){sid=nid();BD.subs.push({id:sid,pid,name:sname})}else if(sid&&!BD.subs.some(x=>x.id===sid&&x.pid===pid))sid=null;
    if(editing)Object.assign(editing,{text:raw,due,time,pid,sid:sid||null});
    else{const p=parse(raw);BD.ideas.push({id:nid(),pid,sid:sid||null,text:p.title,due,time,done:false})}
    closeM();saveB();return}
  const rec=rv?{u:rv[0],n:+rv.slice(1),d:+due.slice(8)}:null;
  if(editing)Object.assign(editing,{title:raw,due,time,cat:fcat,rec,rem:due?REM[fcat]:[]});
  else{const p=parse(raw);tasks.push({id:nid(),title:p.title,due,time,cat:fcat,rec,rem:due?REM[fcat]:[],done:false})}
  closeM();save();}
$('#fab').onclick=()=>{if(tab==='bd'&&bdLock)return;openM(null,{mode:tab==='bd'?'idea':'todo'})};
$('#delb').onclick=()=>{if(!editing||!confirm('Eliminare?'))return;
  if(mode==='idea'){unlink(['i:'+editing.id]);BD.ideas=BD.ideas.filter(x=>x!==editing);closeM();saveB()}else{tasks=tasks.filter(x=>x!==editing);closeM();save()}};
$('#mx').onclick=closeM;$('#addb').onclick=add;
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
$('#in').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
$('#in').addEventListener('input',()=>{const p=parse($('#in').value.trim());
  if(!touched.d)$('#fd').value=p.due||'';
  if(!touched.t)$('#ft').value=p.time||'';
  if(mode==='todo'&&!touched.c){fcat=p.cat;renderCats()}
  if(mode==='todo'&&!touched.r)setRec(p.rec);
  upd()});
$('#fd').addEventListener('change',()=>{touched.d=true;upd()});
$('#ft').addEventListener('change',()=>{touched.t=true});
$('#fr').addEventListener('change',()=>{touched.r=true});
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-c]');if(c){fcat=c.dataset.c;touched.c=true;renderCats();upd();return}
  const sw=e.target.closest('[data-sw]');if(sw){ncol=sw.dataset.sw;renderSw();return}
  const sg=e.target.closest('[data-s]');if(sg){fsub=sg.dataset.s||null;renderSubs();if(fsub==='new')$('#ns').focus();return}
  const g=e.target.closest('[data-g]');if(g){fgrp=g.dataset.g;fsub=null;renderGroups();if(fgrp==='new')$('#ng').focus();return}
  const m=e.target.closest('[data-m]');if(m){setMode(m.dataset.m);if(m.dataset.m==='idea')defGroup();else renderCats();return}
  const f=e.target.closest('[data-cat]');if(f){const k=f.dataset.cat;hidden.has(k)?hidden.delete(k):hidden.add(k);try{localStorage.setItem('au_hidden',JSON.stringify([...hidden]))}catch(x){}render()}
});
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){tab=(tb.dataset.tab==='done'&&tab==='done')?'list':tb.dataset.tab;render();return}
  const pc=e.target.closest('[data-pc]');if(pc){const p=BD.projects.find(x=>x.id===pc.dataset.pid);if(p){p.color=pc.dataset.pc;pcol=null;saveB()}return}
  const actBtn=e.target.closest('[data-act]');
  if(actBtn&&(actBtn.dataset.act==='bdlock'||actBtn.dataset.act==='zin'||actBtn.dataset.act==='zout')){
    const aa=actBtn.dataset.act;
    if(aa==='bdlock'){bdLock=!bdLock;if(bdLock)linkMode=false;linkSrc=null;render()}
    else if(aa==='zin'){zm=Math.min(1.6,+(zm+0.1).toFixed(2));render()}
    else if(aa==='zout'){zm=Math.max(0.6,+(zm-0.1).toFixed(2));render()}
    return}
  if(tab==='bd'&&bdLock)return;
  const wi=linkMode?e.target.closest('.wi'):null,nd=e.target.closest('[data-node]')||(wi?wi.querySelector('[data-node]'):null);
  if(linkMode&&nd){const k=nd.dataset.node;if(!linkSrc){linkSrc=k;render();return}if(linkSrc===k){linkSrc=null;render();return}
    if(!BD.links.some(l=>(l.a===linkSrc&&l.b===k)||(l.a===k&&l.b===linkSrc)))BD.links.push({id:nid(),a:linkSrc,b:k});linkMode=false;linkSrc=null;saveB();return}
  const lk=e.target.closest('[data-link]');if(lk){if(confirm('Eliminare questa freccia?')){BD.links=BD.links.filter(l=>l.id!==lk.dataset.link);saveB()}return}
  const b=actBtn;if(!b)return;
  const a0=b.dataset.act,id0=b.dataset.id,ib=BD.ideas.find(x=>x.id===id0),pb=BD.projects.find(x=>x.id===id0);
  if(a0==='idone'){if(rsup)return;if(ib){ib.done=b.tagName==='INPUT'?b.checked:!ib.done;saveB()}return}
  if(a0==='iedit'){if(ib)openM(ib);return}
  if(a0==='fs'){if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();return}
  if(a0==='linkmode'){linkMode=!linkMode;linkSrc=null;render();return}
  if(a0==='pcol'){pcol=pcol===id0?null:id0;render();return}
  if(a0==='sadd'){const n=prompt('Nome del sottoprogetto');if(n&&n.trim()){BD.subs.unshift({id:nid(),pid:id0,name:n.trim()});saveB()}return}
  const sbb=BD.subs.find(x=>x.id===id0);
  if(a0==='siadd'){if(sbb)openM(null,{mode:'idea',pid:sbb.pid,sid:sbb.id});return}
  if(a0==='sren'){if(sbb){const n=prompt('Rinomina il sottoprogetto',sbb.name);if(n&&n.trim()){sbb.name=n.trim();saveB()}}return}
  if(a0==='sdel'){if(sbb&&confirm('Eliminare il sottoprogetto “'+sbb.name+'”? Le sue idee restano nel progetto.')){BD.ideas.forEach(i=>{if(i.sid===id0)i.sid=null});unlink(['s:'+id0]);BD.subs=BD.subs.filter(x=>x!==sbb);saveB()}return}
  if(a0==='padd'){openM(null,{mode:'idea',pid:id0});return}
  if(a0==='pren'){if(pb){const n=prompt('Rinomina il gruppo',pb.name);if(n&&n.trim()){pb.name=n.trim();saveB()}}return}
  if(a0==='pdel'){if(pb&&confirm('Eliminare il gruppo “'+pb.name+'” e le sue idee?')){unlink(['p:'+id0].concat(BD.ideas.filter(x=>x.pid===id0).map(x=>'i:'+x.id),BD.subs.filter(x=>x.pid===id0).map(x=>'s:'+x.id)));BD.subs=BD.subs.filter(x=>x.pid!==id0);BD.projects=BD.projects.filter(x=>x!==pb);BD.ideas=BD.ideas.filter(x=>x.pid!==id0);saveB()}return}
  const t=tasks.find(x=>x.id===id0),a=a0;
  if(a==='done'&&t){t.done=b.checked;t.doneAt=t.done?Date.now():0;justDone=t.done?t.id:null;
    if(t.done&&t.rec&&t.due&&!t.spawned){let nx=advance(t.due,t.rec),k=0;while(nx<today()&&k++<500)nx=advance(nx,t.rec);const n=nid();tasks.push({id:n,title:t.title,due:nx,time:t.time,cat:t.cat,rem:[...(t.rem||[])],rec:t.rec,done:false});t.spawned=n}
    else if(!t.done&&t.spawned){const sp=tasks.find(x=>x.id===t.spawned);if(sp&&!sp.done)tasks=tasks.filter(x=>x!==sp);t.spawned=null}
    save()}
  else if(a==='del'&&t){if(confirm('Eliminare questa attività?')){tasks=tasks.filter(x=>x!==t);save()}}
  else if(a==='edit'&&t){openM(t)}
  else if(a==='gcal'&&t){window.open(gcalUrl(t),'_blank','noopener')}
  else if(a==='clear'){if(confirm('Eliminare definitivamente le attività completate?')){tasks=tasks.filter(x=>!x.done||hidden.has(x.cat));save()}}
});

$('#bk').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'timeline',v:1,exported:new Date().toISOString(),tasks,board:BD})],{type:'application/json'}));a.download='timeline-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();$('#sync').textContent='Backup scaricato'};
$('#rs').onclick=()=>$('#rf').click();

  if(!confirm('Sostituire i dati attuali con il backup ('+d.tasks.length+' attività, '+(Array.isArray(b.ideas)?b.ideas.length:0)+' idee)?'))return;
  tasks=d.tasks;BD={projects:Array.isArray(b.projects)?b.projects:[],ideas:Array.isArray(b.ideas)?b.ideas:[],links:Array.isArray(b.links)?b.links:[],subs:Array.isArray(b.subs)?b.subs:[]};
  try{localStorage.setItem(BK,JSON.stringify(BD))}catch(x){}save();$('#sync').textContent='Backup ripristinato'}catch(x){alert('File non valido')}};r.readAsText(f);e.target.value=''};
$('#ics').onclick=async()=>{
  const dl=window.claude?await claude.use('downloads').catch(()=>null):null;
  try{if(dl){await dl.save({filename:'timeline.ics',data:icsText()})}else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([icsText()],{type:'text/calendar'}));a.download='timeline.ics';document.body.appendChild(a);a.click();a.remove()}}
  catch(e){$('#sync').textContent='Download .ics non disponibile qui: usa il 📅 su ogni attività.'}
};
render();
// Sync tra dispositivi (se disponibile)
(async()=>{
  try{
    if(!window.claude){$('#sync').textContent='Dati salvati su questo dispositivo';return}
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user){$('#sync').textContent='Dati salvati solo su questo dispositivo';return}
    uid=await user.id();if(!uid)return;
    ref=db.collection('data/users/'+uid).doc('tasks');
    let first=true;
    ref.onSnapshot(s=>{
      const d=s.exists?s.data():null,ok=d&&Array.isArray(d.tasks);
      if(ok&&(d.updated||0)>stamp){tasks=d.tasks;stamp=d.updated||0;try{localStorage.setItem(LS,JSON.stringify(tasks));localStorage.setItem('au_upd',stamp)}catch(e){}render()}
      else if(first&&tasks.length&&(!ok||(d.updated||0)<stamp)){try{ref.set({tasks,updated:stamp||Date.now()}).catch(()=>{})}catch(e){}}
      first=false;$('#sync').textContent='☁ Sincronizzato';
    },()=>{$('#sync').textContent='Dati salvati solo su questo dispositivo'});
  }catch(e){$('#sync').textContent='Dati salvati solo su questo dispositivo'}
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
