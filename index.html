<body>
<main>
<div class="hd"><svg width="40" height="40" viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-width="3.2"><path d="M6 26L11.2 6.7" stroke="#4f7be8"/><path d="M6 26L17.5 9.6" stroke="#34a36b"/><path d="M6 26L22.4 14.5" stroke="#e07a2f"/><path d="M6 26L25.3 20.8" stroke="#8c6fd0"/></svg><div><h1>Ray</h1><div class="hi" id="hello"></div></div></div>

<script>
window.addEventListener('error',e=>{const s=document.getElementById('sync');if(s)s.textContent='Errore: '+e.message});
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromYmd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c,12)};
const addDays=(s,n)=>{const d=fromYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const diff=s=>Math.round((fromYmd(s)-fromYmd(today()))/864e5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const WD=['domenica','lunedi','martedi','mercoledi','giovedi','venerdi','sabato'];
const WDS=['dom','lun','mar','mer','gio','ven','sab'];
const CATS={lavoro:'🎓 University',famiglia:'👨‍👩‍👧 Family',scadenze:'🧾 Deadlines',altro:'📌 Others'};
const ALIAS={lavoro:'lavoro',work:'lavoro',university:'lavoro',famiglia:'famiglia',family:'famiglia',scadenze:'scadenze',deadlines:'scadenze',deadline:'scadenze',altro:'altro',others:'altro',other:'altro'};
const REM={scadenze:[7,1,0],lavoro:[1],famiglia:[1],altro:[1]};
const RX_SC=/\b(tari|tasi|imu|tasse?|irpef|iva|bollo|f24|730|unico|isee|rca|assicurazione|canone|mav|pagopa|rinnovo|scadenza|inps|inail|multa|revisione|commercialista|acconto|saldo)\b/i;
const RX_FA=/\b(figli[ae]|figlie|spesa|pediatra|scuola|dentista|cena|compleanno|nonn[oi]|saggio|festa|palestra|sport|catechismo|colloqui|genitori)\b/i;
const PRE='(?:\\b(?:entro(?:\\s+il)?|per(?:\\s+il)?|il)\\s+)?';

function nextYearless(d,m){let y=new Date().getFullYear();let s=y+'-'+pad(m)+'-'+pad(d);if(s<today())s=(y+1)+'-'+pad(m)+'-'+pad(d);return s}
function parse(raw){
  let t=' '+raw+' ',due=null,time=null,cat=null;
  t=t.replace(/#(lavoro|famiglia|scadenze|altro|work|university|family|deadlines|deadline|others|other)(?=[\s,.;]|$)/i,(m,c)=>{cat=ALIAS[c.toLowerCase()];return ' '});
  t=t.replace(/\b(?:alle|ore|h)\s*(\d{1,2})(?:[:.](\d{2}))?(?=[\s,.;]|$)|\b(\d{1,2}):(\d{2})\b/i,(m,a,b,c,d)=>{const h=+(a??c),mi=+(b??d??0);if(h<24&&mi<60){time=pad(h)+':'+pad(mi);return ' '}return m});
  const now=today();
  const rules=[
    [/\b(dopodomani)(?=[\s,.;]|$)/,()=>addDays(now,2)],
    [/\b(oggi)(?=[\s,.;]|$)/,()=>now],
    [/\b(domani)(?=[\s,.;]|$)/,()=>addDays(now,1)],
    [/\btra\s+(\d+)\s+(giorni|giorno|settimane|settimana)(?=[\s,.;]|$)/,(m,n,u)=>addDays(now,+n*(/sett/.test(u)?7:1))],
    [/\b(\d{1,2})\s+(gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre)(?:\s+(\d{4}))?(?=[\s,.;]|$)/,(m,d,mo,y)=>{const M=MON.indexOf(mo)+1;return y?y+'-'+pad(M)+'-'+pad(+d):nextYearless(+d,M)}],
    [/\b(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?(?=[\s,.;]|$)/,(m,d,mo,y)=>{if(+mo<1||+mo>12||+d<1||+d>31)return null;if(y){y=+y<100?2000+ +y:+y;return y+'-'+pad(+mo)+'-'+pad(+d)}return nextYearless(+d,+mo)}],
    [/(?:\b(prossimo)\s+)?\b(domenica|lunedi|lunedì|martedi|martedì|mercoledi|mercoledì|giovedi|giovedì|venerdi|venerdì|sabato)(?:\s+prossimo)?(?=[\s,.;]|$)/,(m,p,w)=>{const i=WD.indexOf(w.normalize('NFD').replace(/[\u0300-\u036f]/g,''));const dow=new Date().getDay();return addDays(now,((i-dow+7)%7)||7)}]
  ];
  for(const [rx,fn] of rules){
    const re=new RegExp(PRE+rx.source,'i');
    const mt=t.match(re);
    if(mt){const r=fn(...mt.slice(0));if(r){due=r;t=t.replace(re,' ');break}}
  }
  let title=t.replace(/\s+/g,' ').trim().replace(/[,\-–:;]+$/,'').trim();
  if(!title)title=raw.trim();
  title=title.charAt(0).toUpperCase()+title.slice(1);
  if(!cat)cat=RX_SC.test(raw)?'scadenze':RX_FA.test(raw)?'famiglia':'altro';
  return{title,due,time,cat,rem:due?REM[cat]:[]};
}
const fmtDate=s=>{const d=fromYmd(s);return WDS[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()].slice(0,3)+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')};
const rel=s=>{const n=diff(s);return n===0?'oggi':n===1?'domani':n===-1?'ieri':n<0?(-n)+' gg fa':'tra '+n+' gg'};

let justDone=null;const CK=Object.keys(CATS);let hidden=new Set();try{hidden=new Set(JSON.parse(localStorage.getItem('au_hidden')||'[]'))}catch(e){}
let tasks=[],tab='list',ref=null,uid=null;
const LS='agenda_unica_v1';
try{tasks=JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){tasks=[]}
let stamp=0;try{stamp=+(localStorage.getItem('au_upd')||0)}catch(e){}
function save(){
  stamp=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(tasks));localStorage.setItem('au_upd',stamp)}catch(e){}
  render();
  const bad=()=>{$('#sync').textContent='⚠ Sync non riuscita (dati solo su questo dispositivo)'};
  if(ref){try{ref.set({tasks,updated:stamp}).catch(bad)}catch(e){bad()}}
}
function tdate(t){return t.due?t.due+(t.time?' '+t.time:''):'9999'}
function active(t){if(t.done)return false;if(!t.due)return false;const mx=Math.max(0,...(t.rem||[0]));return diff(t.due)<=mx}

function item(t){
  const n=t.due?diff(t.due):null;
  const cls=n!==null&&n<0&&!t.done?'late':n!==null&&n<=2&&!t.done?'soon':'';
  return `<div class="t c-${t.cat||'altro'} ${t.done?'done':''} ${t.id===justDone?'pop':''}"><input type="checkbox" data-act="done" data-id="${t.id}" ${t.done?'checked':''} aria-label="Fatto"><div class="b" data-act="edit" data-id="${t.id}"><div class="ti">${esc(t.title)}</div><div class="m"><span class="tag">${CATS[t.cat]||CATS.altro}</span>${t.due?`<span class="${cls}">${fmtDate(t.due)}${t.time?' · '+t.time:''} · ${rel(t.due)}</span>`:'senza scadenza'}${t.rem&&t.rem.length&&t.due?' · 🔔 '+t.rem.map(r=>r?r+'g':'0').join('/'):''}</div></div>${t.due&&!t.done?`<button class="ic" data-act="gcal" data-id="${t.id}" title="Aggiungi a Google Calendar">📅</button>`:''}<button class="ic" data-act="del" data-id="${t.id}" title="Elimina">✕</button></div>`;
}
function hello(){const n=new Date(),dn=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'][n.getDay()],o=tasks.filter(t=>!t.done&&t.due),td=o.filter(t=>t.due===today()).length,ov=o.filter(t=>t.due<today()).length;
  $('#hello').textContent=dn+' '+n.getDate()+' '+MON[n.getMonth()]+' · '+(td?td+(td===1?' cosa per oggi':' cose per oggi'):'niente in scadenza oggi')+(ov?' · '+ov+' in ritardo':'')}
function ideaItem(i){const p=BD.projects.find(x=>x.id===i.pid)||{name:'',color:'#d9c34a'};
  return `<div class="t ${i.done?'done':''}" style="--cl:${p.color}"><input type="checkbox" data-act="idone" data-id="${i.id}" ${i.done?'checked':''} aria-label="Done"><div class="b" data-act="iedit" data-id="${i.id}"><div class="ti">${esc(i.text)}</div><div class="m"><span class="tag">💡 ${esc(p.name)}</span>${fmtDate(i.due)}${i.time?' · '+i.time:''} · ${rel(i.due)}</div></div></div>`}
function boardView(){
  if(!BD.projects.length)return '<div class="bd"><div class="bde">La lavagna è vuota.<br>Tocca + e scegli “Idea” per iniziare il primo progetto.</div></div>';
  return '<div class="bd"><div class="bdi">'+BD.projects.map(p=>{
    const its=BD.ideas.filter(i=>i.pid===p.id);
    return `<div class="pj" style="--ch:${p.color}"><div class="pt"><span>${esc(p.name)}</span><button data-act="pcol" data-id="${p.id}" title="Colore">🎨</button><button data-act="pren" data-id="${p.id}" title="Rename">✎</button><button data-act="pdel" data-id="${p.id}" title="Delete">✕</button></div>${pcol===p.id?`<div class="sw">${CHALK.map(c=>`<i style="--c:${c}" data-pc="${c}" data-pid="${p.id}" class="${c===p.color?'on':''}"></i>`).join('')}</div>`:''}<ul>${its.map(i=>`<li class="ii${i.done?' dn2':''}"><span class="ck" data-act="idone" data-id="${i.id}">${i.done?'✓':'○'}</span><span class="tx" data-act="iedit" data-id="${i.id}">${esc(i.text)}${i.due?` <small>📅 ${fmtDate(i.due)}</small>`:''}</span></li>`).join('')}</ul><button class="addi" data-act="padd" data-id="${p.id}">+ add</button></div>`}).join('')+'</div></div>';
}
function doneView(T){
  const dn=T.filter(t=>t.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)||tdate(b).localeCompare(tdate(a)));
  if(!dn.length)return '<div class="empty">Nessuna attività completata.</div>';
  return '<div class="note" style="margin-bottom:8px">Tocca la spunta per riaprire un’attività, o toccala per modificarla.</div>'+dn.map(item).join('')+'<button data-act="clear" style="margin-top:8px">Elimina tutte le completate</button>';
}
function filters(){$('#filters').innerHTML=CK.map(c=>`<button class="fl c-${c}${hidden.has(c)?' off':''}" data-cat="${c}">${CATS[c]}</button>`).join('')+`<button class="fl c-idea${hidden.has('idea')?' off':''}" data-cat="idea">💡 Ideas</button><button class="fl dn${tab==='done'?' on':''}" data-tab="done">✓ Done</button>`}
function timeline(open){
  const vc=[...CK,'idea'].filter(c=>!hidden.has(c)),dated=open.filter(t=>t.due),by={},gh={},ib={},IDs=hidden.has('idea')?[]:BD.ideas.filter(i=>i.due&&!i.done);
  IDs.forEach(i=>(ib[i.due]=ib[i.due]||[]).push(i));
  dated.forEach(t=>{(by[t.due]=by[t.due]||[]).push(t);(t.rem||[]).filter(r=>r>0).forEach(r=>{const d=addDays(t.due,-r);if(d>=today())(gh[d]=gh[d]||[]).push([t,r])})});
  let d=today(),e=addDays(d,13);
  dated.concat(IDs).forEach(t=>{if(t.due<d)d=t.due;if(t.due>e)e=t.due});
  const mx=addDays(today(),120);let cut=false;if(e>mx){e=mx;cut=true}
  let h='<div class="tg">',last='';
  while(d<=e){
    const dt=fromYmd(d),n=diff(d),ts=by[d]||[],is=ib[d]||[],gs=gh[d]||[],mk=MON[dt.getMonth()]+' '+dt.getFullYear();
    if(mk!==last){h+=`<div class="mh">${mk}</div>`;last=mk}
    const rail=vc.map(c=>`<i class="ln c-${c}${(c==='idea'?is.length:ts.some(t=>t.cat===c))?' dot':''}"></i>`).join('');
    h+=`<div class="r${n===0?' td':''}${[0,6].includes(dt.getDay())?' we':''}"><div class="dd"><b>${dt.getDate()}</b> ${n===0?'oggi':WDS[dt.getDay()]}</div><div class="rl">${rail}</div><div class="rc">${ts.map(item).join('')}${is.map(ideaItem).join('')}${gs.map(([t,r])=>`<div class="ghost c-${t.cat}">🔔 ${esc(t.title)} · tra ${r} gg</div>`).join('')}</div></div>`;
    d=addDays(d,1);
  }
  h+='</div>'+(cut?'<div class="note">Mostro i prossimi 120 giorni.</div>':'');
  const nd=open.filter(t=>!t.due);
  if(nd.length)h+='<h3>Senza data</h3>'+nd.map(item).join('');
  return h;
}
function render(){
  filters();hello();
  const T=tasks.filter(t=>!hidden.has(t.cat));
  const open=T.filter(t=>!t.done).sort((a,b)=>tdate(a).localeCompare(tdate(b)));
  const act=open.filter(active);
  $('#now').innerHTML=act.length?`<div class="now"><h2>⚠ Da guardare ora (${act.length}) — resta qui finché non lo spunti</h2>${act.map(item).join('')}</div>`:'';
  let h='';
  if(tab==='list'){
    const g={Scaduti:[],Oggi:[],'Prossimi 7 giorni':[],'Più avanti':[],'Senza data':[]};
    open.filter(t=>!active(t)).forEach(t=>{if(!t.due)g['Senza data'].push(t);else{const n=diff(t.due);(n<0?g.Scaduti:n===0?g.Oggi:n<=7?g['Prossimi 7 giorni']:g['Più avanti']).push(t)}});
    for(const k in g)if(g[k].length)h+=`<h3>${k}</h3>`+g[k].map(item).join('');
    if(!h)h='<div class="empty">'+(T.length?'Tutto fatto! Trovi le completate con ✓ Done, sotto i filtri.':'Nessuna attività. Tocca il + per aggiungerne una.')+'</div>';
  }else if(tab==='done'){h=doneView(T)}else if(tab==='bd'){h=boardView()}else h=timeline(open);
  $('#view').innerHTML=h;justDone=null;$('#filters').hidden=tab==='bd';if(tab==='bd')$('#now').innerHTML='';
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
}

function gcalUrl(t){
  const d=t.due.replace(/-/g,'');let dates;
  if(t.time){const s=d+'T'+t.time.replace(':','')+'00';const e=new Date(fromYmd(t.due));const [h,m]=t.time.split(':');e.setHours(+h+1,+m);dates=s+'/'+ymd(e).replace(/-/g,'')+'T'+pad(e.getHours())+pad(e.getMinutes())+'00'}
  else dates=d+'/'+addDays(t.due,1).replace(/-/g,'');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(t.title)+'&dates='+dates+'&details='+encodeURIComponent(CATS[t.cat]+' — da Agenda unica');
}
function icsText(){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Agenda unica//IT','CALSCALE:GREGORIAN'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  tasks.filter(t=>t.due&&!t.done).forEach(t=>{
    L.push('BEGIN:VEVENT','UID:'+t.id+'@agenda-unica','DTSTAMP:'+stamp,'SUMMARY:'+t.title.replace(/[,;\\]/g,'\\$&'));
    const d=t.due.replace(/-/g,'');
    if(t.time){const e=new Date(fromYmd(t.due));const[h,m]=t.time.split(':');e.setHours(+h+1,+m);L.push('DTSTART:'+d+'T'+t.time.replace(':','')+'00','DTEND:'+ymd(e).replace(/-/g,'')+'T'+pad(e.getHours())+pad(e.getMinutes())+'00')}
    else L.push('DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+addDays(t.due,1).replace(/-/g,''));
    (t.rem||[]).forEach(r=>{
      const a=fromYmd(addDays(t.due,-r));a.setHours(9,0,0,0);
      L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+t.title.replace(/[,;\\]/g,'\\$&'),'TRIGGER;VALUE=DATE-TIME:'+a.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''),'END:VALARM');
    });
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');return L.join('\r\n');
}

const BK='ray_board_v1',CHALK=['#f4d35e','#ff9aa2','#8ecae6','#95d5b2','#ffb36b','#c3a6ff','#ef6f6c','#7fdbda'],nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
let BD={projects:[],ideas:[]};try{const b=JSON.parse(localStorage.getItem(BK)||'null');if(b&&Array.isArray(b.projects)&&Array.isArray(b.ideas))BD=b}catch(e){}
function saveB(){try{localStorage.setItem(BK,JSON.stringify(BD))}catch(e){}render()}
let touched={},fcat='altro',editing=null,mode='todo',fgrp=null,ncol=CHALK[0],pcol=null;
function renderSw(){const el=$('#cs');el.hidden=fgrp!=='new';el.innerHTML=CHALK.map(c=>`<i style="--c:${c}" data-sw="${c}" class="${c===ncol?'on':''}"></i>`).join('')}
function renderCats(){$('#fc').innerHTML=CK.map(c=>`<button type="button" class="cc c-${c}${fcat===c?' on':''}" data-c="${c}">${fcat===c?'✓ ':''}${CATS[c]}</button>`).join('')}
function renderGroups(){
  $('#fg').innerHTML=BD.projects.map(p=>`<button type="button" class="cc${fgrp===p.id?' on':''}" style="--cl:${p.color}" data-g="${p.id}">${fgrp===p.id?'✓ ':''}${esc(p.name)}</button>`).join('')+`<button type="button" class="cc${fgrp==='new'?' on':''}" data-g="new">${fgrp==='new'?'✓ ':''}＋ Nuovo gruppo</button>`;
  $('#ng').hidden=fgrp!=='new';renderSw();
}
function defGroup(){fgrp=fgrp||(BD.projects.length?BD.projects[0].id:'new');renderGroups()}
function setMode(m){mode=m;$('#todoOnly').hidden=m!=='todo';$('#ideaOnly').hidden=m!=='idea';
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  $('#in').placeholder=m==='todo'?'Es. Pagare TARI entro 16/12 · Dentista figlia domani alle 17':'Descrivi l’idea…'}
function upd(){if(editing){$('#prev').textContent='';return}const v=$('#in').value.trim();if(!v){$('#prev').textContent='';return}const p=parse(v),d=$('#fd').value,r=(mode==='todo'&&d)?REM[fcat]:[];
  $('#prev').textContent='→ '+p.title+(r.length?' · 🔔 '+r.map(x=>x+'g').join('/'):'')}
function openM(t,o){o=o||{};editing=t||null;
  const idea=t?!!t.pid:o.mode==='idea';
  setMode(idea?'idea':'todo');$('#seg').hidden=!!t;
  $('#in').value=t?(idea?t.text:t.title):'';$('#fd').value=t&&t.due||'';$('#ft').value=t&&t.time||'';
  touched=t?{d:1,t:1,c:1}:{};fcat=(t&&!idea)?(t.cat||'altro'):'altro';renderCats();
  fgrp=idea?(t?t.pid:(o.pid||null)):null;ncol=CHALK[BD.projects.length%CHALK.length];if(idea)defGroup();$('#ng').value='';
  $('#prev').textContent='';
  $('#mt').textContent=t?(idea?'Modifica idea':'Modifica attività'):'Nuovo';$('#addb').textContent=t?'Salva modifiche':'Aggiungi';$('#delb').hidden=!t;
  $('#modal').hidden=false;if(!t)setTimeout(()=>$('#in').focus(),50)}
function closeM(){$('#modal').hidden=true}
function add(){const raw=$('#in').value.trim();if(!raw)return;const due=$('#fd').value||null,time=due?($('#ft').value||null):null;
  if(mode==='idea'){
    let pid=fgrp;
    if(pid==='new'||!BD.projects.some(p=>p.id===pid)){const nm=$('#ng').value.trim();if(!nm){fgrp='new';renderGroups();$('#ng').placeholder='Scrivi il nome del gruppo';$('#ng').focus();return}
      pid=nid();BD.projects.push({id:pid,name:nm,color:ncol})}
    if(editing)Object.assign(editing,{text:raw,due,time,pid});
    else{const p=parse(raw);BD.ideas.push({id:nid(),pid,text:p.title,due,time,done:false})}
    closeM();saveB();return}
  if(editing)Object.assign(editing,{title:raw,due,time,cat:fcat,rem:due?REM[fcat]:[]});
  else{const p=parse(raw);tasks.push({id:nid(),title:p.title,due,time,cat:fcat,rem:due?REM[fcat]:[],done:false})}
  closeM();save();}
$('#fab').onclick=()=>openM(null,{mode:tab==='bd'?'idea':'todo'});
$('#delb').onclick=()=>{if(!editing||!confirm('Eliminare?'))return;
  if(mode==='idea'){BD.ideas=BD.ideas.filter(x=>x!==editing);closeM();saveB()}else{tasks=tasks.filter(x=>x!==editing);closeM();save()}};
$('#mx').onclick=closeM;$('#addb').onclick=add;
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
$('#in').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
$('#in').addEventListener('input',()=>{const p=parse($('#in').value.trim());
  if(!touched.d)$('#fd').value=p.due||'';
  if(!touched.t)$('#ft').value=p.time||'';
  if(mode==='todo'&&!touched.c){fcat=p.cat;renderCats()}
  upd()});
$('#fd').addEventListener('change',()=>{touched.d=true;upd()});
$('#ft').addEventListener('change',()=>{touched.t=true});
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-c]');if(c){fcat=c.dataset.c;touched.c=true;renderCats();upd();return}
  const sw=e.target.closest('[data-sw]');if(sw){ncol=sw.dataset.sw;renderSw();return}
  const g=e.target.closest('[data-g]');if(g){fgrp=g.dataset.g;renderGroups();if(fgrp==='new')$('#ng').focus();return}
  const m=e.target.closest('[data-m]');if(m){setMode(m.dataset.m);if(m.dataset.m==='idea')defGroup();else renderCats();return}
  const f=e.target.closest('[data-cat]');if(f){const k=f.dataset.cat;hidden.has(k)?hidden.delete(k):hidden.add(k);try{localStorage.setItem('au_hidden',JSON.stringify([...hidden]))}catch(x){}render()}
});
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){tab=(tb.dataset.tab==='done'&&tab==='done')?'list':tb.dataset.tab;render();return}
  const pc=e.target.closest('[data-pc]');if(pc){const p=BD.projects.find(x=>x.id===pc.dataset.pid);if(p){p.color=pc.dataset.pc;pcol=null;saveB()}return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a0=b.dataset.act,id0=b.dataset.id,ib=BD.ideas.find(x=>x.id===id0),pb=BD.projects.find(x=>x.id===id0);
  if(a0==='idone'){if(ib){ib.done=b.tagName==='INPUT'?b.checked:!ib.done;saveB()}return}
  if(a0==='iedit'){if(ib)openM(ib);return}
  if(a0==='pcol'){pcol=pcol===id0?null:id0;render();return}
  if(a0==='padd'){openM(null,{mode:'idea',pid:id0});return}
  if(a0==='pren'){if(pb){const n=prompt('Rinomina il gruppo',pb.name);if(n&&n.trim()){pb.name=n.trim();saveB()}}return}
  if(a0==='pdel'){if(pb&&confirm('Eliminare il gruppo “'+pb.name+'” e le sue idee?')){BD.projects=BD.projects.filter(x=>x!==pb);BD.ideas=BD.ideas.filter(x=>x.pid!==id0);saveB()}return}
  const t=tasks.find(x=>x.id===id0),a=a0;
  if(a==='done'&&t){t.done=b.checked;t.doneAt=t.done?Date.now():0;justDone=t.done?t.id:null;save()}
  else if(a==='del'&&t){if(confirm('Eliminare questa attività?')){tasks=tasks.filter(x=>x!==t);save()}}
  else if(a==='edit'&&t){openM(t)}
  else if(a==='gcal'&&t){window.open(gcalUrl(t),'_blank','noopener')}
  else if(a==='clear'){if(confirm('Eliminare definitivamente le attività completate?')){tasks=tasks.filter(x=>!x.done||hidden.has(x.cat));save()}}
});
(()=>{let d=null;document.addEventListener('mousedown',e=>{const el=e.target.closest('.bd');if(!el||e.target.closest('[data-act]'))return;d={x:e.clientX,y:e.clientY,l:el.scrollLeft,t:el.scrollTop,el}});

// Sync tra dispositivi (se disponibile)
(async()=>{
  try{
    if(!window.claude){$('#sync').textContent='Dati salvati su questo dispositivo';return}
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user){$('#sync').textContent='Dati salvati solo su questo dispositivo';return}
    uid=await user.id();if(!uid)return;
    ref=db.collection('data/users/'+uid).doc('tasks');
    let first=true;
    ref.onSnapshot(s=>{
      const d=s.exists?s.data():null,ok=d&&Array.isArray(d.tasks);
      if(ok&&(d.updated||0)>stamp){tasks=d.tasks;stamp=d.updated||0;try{localStorage.setItem(LS,JSON.stringify(tasks));localStorage.setItem('au_upd',stamp)}catch(e){}render()}
      else if(first&&tasks.length&&(!ok||(d.updated||0)<stamp)){try{ref.set({tasks,updated:stamp||Date.now()}).catch(()=>{})}catch(e){}}
      first=false;$('#sync').textContent='☁ Sincronizzato';
    },()=>{$('#sync').textContent='Dati salvati solo su questo dispositivo'});
  }catch(e){$('#sync').textContent='Dati salvati solo su questo dispositivo'}
})();
